<style>

.eb{font:700 .78rem Cinzel,serif;letter-spacing:.28em;color:var(--saf);text-transform:uppercase}
.hi{font:1.25rem 'Tiro Devanagari Hindi',serif;color:var(--gold);margin-left:10px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips span{border:1px solid var(--gold);border-radius:99px;padding:1px 11px;font-size:.85rem;color:var(--gold)}
.cards{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px}

.card h4{overflow-wrap:anywhere}
#tour-hint{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:5;font:11px Cinzel,serif;letter-spacing:.14em;color:var(--ivory);opacity:.65;pointer-events:none}
.card h4{font:700 1.05rem/1.2 Cinzel,serif;color:var(--gold);margin-bottom:4px}.card p{font-size:1.02rem;line-height:1.4}.card .n{font:900 1.6rem Cinzel;color:var(--saf)}
.btn{display:inline-block;margin:4px 8px 0 0;padding:8px 20px;border-radius:99px;border:2px solid var(--gold);color:var(--gold);text-decoration:none;font:700 .8rem Cinzel,serif;letter-spacing:.14em;text-transform:uppercase}
.btn:hover{background:var(--gold);color:var(--ink)}.btn.f{background:linear-gradient(120deg,#6e1420,#c4531a);border-color:#f1cf86;color:#fff}
.card a{font:700 .78rem Cinzel;color:var(--saf);letter-spacing:.1em;text-decoration:none}
#spacer{height:1000vh}
@media(max-width:640px){.wall b{font-size:1.6rem}.panel{padding:14px 16px;bottom:2vh;max-height:42vh}.panel.big{top:12vh;bottom:auto}.cards{gap:10px}.card{flex-basis:min(285px,82vw)}header{font-size:.68rem;letter-spacing:.18em;padding:14px 16px}}
@media(prefers-reduced-motion:reduce){.ring,.book,#dust s{animation:none}.flip{transform-style:preserve-3d}.flip .inner{transition:none}}

<header>BHUPENDRA SINGH DEORA &middot; MEWAR</header><div id="tour-hint" aria-hidden="true">SCROLL · EXPLORE THE ROOMS</div>

<script>
const SP=1400,GH='https://github.com/bhupendra272003',REPOS=GH+'?tab=repositories';
const $=(s)=>document.querySelector(s),clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ch=a=>`<div class="chips">${a.map(x=>`<span>${x}</span>`).join('')}</div>`;
const card=(n,t,d,c,u)=>{const slug={'BFSI Customer &amp; Loan Analytics':'bfsi','Bank Analytics Dashboard':'bank-analytics','Logistics &amp; Supply Chain Performance':'logistics','Inside Airbnb: San Diego':'airbnb','Sales Dashboard':'sales','Retinal Disease Detection':'retinal','Query Panel':'query-panel','The Mewar Palace':'palace'}[t]||'';const shot=slug?`<img class=\"card-shot\" src=\"images/${slug}-1.png\" alt=\"${t} screenshot\" loading=\"lazy\" onload=\"this.classList.add('ready')\" onerror=\"this.remove()\">`:'';return `<article class=\"card\">${shot}<span class=\"n\">${n}</span><h4>${t}</h4><p>${d}</p>${ch(c)}<a href=\"${u}\" target=\"_blank\" rel=\"noopener noreferrer\">Explore &#8599;</a></article>`};
const R=[
{id:'Gate',hi:'स्वागतम्',tint:'#c4531a',g:'',big:1,h:`<div class="eb">Udaipur &middot; Mewar &middot; India</div><h1>Bhupendra<br>Singh Deora</h1><p class="l">Data Analyst. Step inside a palace built from data, craft and stories, and let the tour begin.</p><a class="btn f" href="#" data-go="1">Begin the tour &darr;</a>`},
{id:'Rajcourt',hi:'राजसभा',tint:'#e2802a',h:`<div class="eb">Chapter I &middot; The Rajcourt</div><h2>Where the story begins.</h2><p class="l">I am an aspiring Data Analyst from Udaipur, Mewar. I clean, question and connect data until a business story becomes easier to understand — then build a dashboard that lets others inspect that story for themselves.</p>${ch(['Excel','MySQL','Python (Pandas)','Power BI','DAX','Data Cleaning','Reporting'])}`},
{id:'Milestones',hi:'उपलब्धि कक्ष',tint:'#d9a84e',h:`<div class="eb">Chapter II &middot; Hall of Milestones</div><h2>Every step, a chapter.</h2><div class="cards">${[['I','Academic Foundation','B.Tech in Computer Science and Engineering: the groundwork for logic, systems and analytical thinking.'],['II','Technical Practice','Hands-on work in Excel, SQL, Python and Power BI, learned on real and messy datasets.'],['III','Industry Exposure','A Virtual Salesforce Developer internship that taught platform thinking beyond the classroom.'],['IV','Independent Creation','Portfolio projects built end to end: raw data, clean model, finished dashboard.'],['V','Author','Published "23 &amp; Confused", a book on navigating the years of becoming.']].map(([n,t,d])=>`<article class="card"><span class="n">${n}</span><h4>${t}</h4><p>${d}</p></article>`).join('')}</div>`},
{id:'Data',hi:'डेटा कक्ष',tint:'#2b9a9a',g:'&Sigma;',h:`<div class="eb">Chapter III &middot; Chamber of Data</div><h2>Numbers, made to speak.</h2><div class="cards"><div class="project-gallery" aria-label="Project visual motifs (not dashboard screenshots)"><div class="project-visual" style="--glow:#e2b05b66">BFSI · EXCEL<svg viewBox="0 0 200 60"><g fill="none" stroke="#e2b05b" stroke-width="3"><path d="M10 48V28h28v20M52 48V15h28v33M94 48V7h28v41M136 48V23h28v25"/><path d="M10 54H188" stroke-width="1"/></g></svg></div><div class="project-visual" style="--glow:#4ca1a666">BANK · SQL<svg viewBox="0 0 200 60"><g fill="none" stroke="#4ca1a6" stroke-width="2"><ellipse cx="35" cy="13" rx="22" ry="9"/><path d="M13 13v28c0 11 44 11 44 0V13M13 26c0 11 44 11 44 0M75 45L98 25l23 10 28-27 23 22"/></g></svg></div><div class="project-visual" style="--glow:#d68a3766">LOGISTICS · FLOW<svg viewBox="0 0 200 60"><g fill="none" stroke="#d68a37" stroke-width="2"><path d="M10 40H50V20h35v20h30V15h35v25h15"/><circle cx="50" cy="20" r="5"/><circle cx="115" cy="15" r="5"/><circle cx="165" cy="40" r="5"/><path d="M10 50H180" stroke-dasharray="5 5"/></g></svg></div><div class="project-visual" style="--glow:#8a78b966">AIRBNB · SQL<svg viewBox="0 0 200 60"><g fill="none" stroke="#9b92d4" stroke-width="2"><path d="M20 48L45 15l25 33 25-24 25 24 25-35 25 35"/><circle cx="45" cy="15" r="4"/><circle cx="115" cy="24" r="4"/><circle cx="165" cy="13" r="4"/></g></svg></div><div class="project-visual" style="--glow:#c4531a66">SALES · DAX<svg viewBox="0 0 200 60"><g fill="none" stroke="#c4531a" stroke-width="3"><rect x="15" y="30" width="25" height="20"/><rect x="55" y="20" width="25" height="30"/><rect x="95" y="8" width="25" height="42"/><rect x="135" y="18" width="25" height="32"/></g></svg></div></div>${[
card('01','BFSI Customer &amp; Loan Analytics','Over 6,000 customer and loan records cleaned and validated, then shaped into an Excel KPI dashboard with PivotTables and slicers across customers, loans, branches, states and insurance.',['Excel','PivotTables','SUMIFS','INDEX-MATCH'],GH+'/Banking-Analytics'),
card('02','Bank Analytics Dashboard','A Czech bank\'s accounts, clients, cards, loans and transactions loaded into MySQL by a Python script, then explored in a seven-page Power BI report with drill-through. The report uses drill-through pages, and SQL validation queries are used to cross-check selected measures.',['MySQL','Python','Power BI','DAX'],GH+'/Banking-Analytics'),
card('03','Logistics &amp; Supply Chain Performance','Orders, shipments, carriers and locations cleaned in Python, structured in MySQL and presented in a Power BI dashboard that shows how reliably deliveries move.',['MySQL','Python','Power BI'],GH+'/Logistics-Supply-Chain-Analytics'),
card('04','Inside Airbnb: San Diego','Listings, reviews and calendar data loaded into MySQL, with price outliers and suspicious listings flagged through a SQL view, ready for dashboard storytelling.',['MySQL','Window functions','Python','Power BI'],GH+'/Inside-Airbnb-San-Diego'),
card('05','Sales Dashboard','A four-page Power BI report with overview, product and customer analysis, Python visuals and product drill-through, fed by Python ETL and DAX measures.',['Python','DAX','Power BI'],GH+'/Sales-Performance-Analytics')].join('')}</div>`},
{id:'AI',hi:'बुद्धि कक्ष',tint:'#8a4cc4',g:'&psi;',h:`<div class="eb">Chapter IV &middot; Chamber of Intelligence</div><h2>Teaching machines to see.</h2><div class="cards">${card('01','Retinal Disease Detection','An image-based AI/ML project exploring retinal disease detection. [EDIT: document the model architecture, dataset, preprocessing, validation and actual results here before publishing.]',['AI / ML','Image classification'],REPOS)}<article class="card"><span class="n">&infin;</span><h4>More experiments brewing</h4><p>This chamber grows as my machine-learning journey does.</p></article></div>`},
{id:'Web',hi:'शिल्प कक्ष',tint:'#c4531a',g:'&lt;/&gt;',h:`<div class="eb">Chapter V &middot; Chamber of Craft</div><h2>Software, built to be used.</h2><div class="cards">${card('01','Query Panel','A WhatsApp-style support inbox built on Node.js, Express, SQLite and Socket.IO: real-time conversations with file uploads, so a team can resolve every query in one place.',['Node.js','Express','SQLite','Socket.IO'],REPOS)+card('02','The Mewar Palace','This very portfolio: a scroll-driven 3D palace tour crafted with plain HTML, CSS and JavaScript.',['HTML','CSS','JavaScript'],GH+'/Portfolio')}</div>`},
{id:'Library',hi:'ग्रंथालय',tint:'#d9a84e',g:'',h:`<div class="eb">Chapter VI &middot; The Royal Library</div><h2>Some journeys are written.</h2><p class="l"><b>23 &amp; Confused: A Survival Guide for the Years Nobody Prepared Us For.</b> Honest reflections on uncertainty, growing up and finding direction in your twenties, written for everyone who left college and wondered what comes next.</p><p class="l"><i>Next on the shelf: The Data Behind Life, an exploration of data and everyday decisions.</i></p><a class="btn f" href="https://www.amazon.com/dp/B0HMNQSHG1">Read the book &#8599;</a>`},
{id:'Horizon',hi:'क्षितिज',tint:'#2b4a9a',g:'',big:1,h:`<div class="eb">Chapter VII &middot; Under the Mewar Sky</div><h2 style="font-size:clamp(1.8rem,5vw,3.4rem)">A new chapter, beyond the horizon.</h2><p class="l">Open to entry-level Data Analyst roles and collaborations. From the old city of lakes to the next chapter of my career, I would love to hear from you.</p><a class="btn f" href="mailto:bhupendrasinghdeora24@gmail.com">Email</a><a class="btn" href="https://www.linkedin.com/in/bhupendra-singh-deora">LinkedIn</a><a class="btn" href="${GH}">GitHub</a><a class="btn" href="https://portfoliobcr.vercel.app/cv.html">CV</a>`}];
const N=R.length,world=$('#world');
const add=(p,c,s,h='')=>{const d=document.createElement('div');d.className=c;d.style.cssText=s;d.innerHTML=h;p.appendChild(d);return d};
const rooms=R.map((r,k)=>{
 const z0=-k*SP+200,room=add(world,'room','');room.style.setProperty('--tint',r.tint);
 add(room,'floor',`left:-500px;top:0;width:1000px;height:${SP}px;transform-origin:0 0;transform:translate3d(0,260px,${z0}px) rotateX(-90deg)`);
 add(room,'runner',`left:-90px;top:0;width:180px;height:${SP}px;transform-origin:0 0;transform:translate3d(0,259px,${z0}px) rotateX(-90deg)`);
 add(room,'ceil',`left:-500px;top:0;width:1000px;height:${SP}px;transform-origin:0 0;transform:translate3d(0,-340px,${z0}px) rotateX(-90deg)`);
 const inner=k==6?'<div class="shelf"></div>':[90,520,950].map(x=>`<i style="left:${x}px"></i>`).join('')+(k&&k<7?`<b>${r.hi}</b>`:'');
 add(room,'wall',`left:0;top:0;width:${SP}px;height:600px;transform-origin:0 0;transform:translate3d(-500px,-340px,${z0}px) rotateY(90deg)`,inner);
 add(room,'wall',`left:0;top:0;width:${SP}px;height:600px;transform-origin:${SP}px 0;transform:translate3d(${500-SP}px,-340px,${z0}px) rotateY(-90deg)`,inner);
 [.2,.5,.8].forEach(f=>[-410,410].forEach(x=>add(room,'pillar',`left:-35px;top:0;width:70px;height:600px;transform:translate3d(${x}px,-340px,${z0-SP*f}px)`)));
 [.3,.7].forEach(f=>add(room,'glow',`left:-45px;top:-300px;width:90px;height:90px;transform:translate3d(0,0,${z0-SP*f}px)`));
 if(k<N-1)add(room,'arch',`left:-330px;top:-300px;width:660px;height:560px;transform:translate3d(0,0,${z0-SP+30}px)`);
 if(k==1){add(room,'arch',`left:-260px;top:-300px;width:520px;height:560px;background:radial-gradient(ellipse at 50% 70%,#e2802a55,#0a0405 70%);transform:translate3d(0,0,${z0-700}px)`);
  const f=add(room,'flip',`left:-150px;top:-140px;width:300px;height:400px;transform:translate3d(0,0,${z0-460}px)`,`<div class="inner"><div class="face front">BD</div><div class="face back"><img src="photo.jpg" alt="Bhupendra Singh Deora" onerror="this.remove()"></div></div>`);room.flip=f}
 if(k==2)[-300,-150,0,150,300].forEach((x,i)=>add(room,'glow',`left:-30px;top:-20px;width:60px;height:60px;transform:translate3d(${x}px,${i%2*30}px,${z0-420-i*40}px)`));
 if(r.g)add(room,'pos',`left:-130px;top:-170px;width:260px;height:260px;transform:translate3d(0,0,${z0-480}px)`,`<div class="ring" style="position:absolute;inset:0"></div><div class="glyph" style="position:absolute;inset:0">${r.g}</div>`);
 if(k==6)add(room,'pos',`left:-130px;top:-120px;width:260px;height:360px;transform:translate3d(0,0,${z0-460}px)`,'<div class="book" style="position:absolute;inset:0">23 &amp;<br>CONFUSED<small>A SURVIVAL GUIDE</small></div>');
 if(k==7)add(room,'glow',`left:-170px;top:-330px;width:340px;height:340px;background:radial-gradient(circle,#fff6d8,#e8d9a8 35%,rgba(232,217,168,.15) 62%,transparent 70%);transform:translate3d(0,0,${z0-SP+60}px)`);
 return room});
// panels and dots
const pw=$('#panels'),dots=$('#dots');
const panels=R.map((r,k)=>{const p=document.createElement('section');p.className='panel'+(r.big?' big':'');p.setAttribute('aria-label',r.id);p.innerHTML=r.h.replace('</div>',`<span class="hi">${r.hi}</span></div>`);pw.appendChild(p);
 const b=document.createElement('button');b.setAttribute('aria-label',r.id+' - '+r.hi);b.title=r.id;b.onclick=()=>go(k);dots.appendChild(b);return p});
const maxS=()=>document.documentElement.scrollHeight-innerHeight;
function go(k){scrollTo({top:k/(N-1)*maxS(),behavior:'smooth'})}
document.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();go(+a.dataset.go)}});
document.addEventListener('keydown',e=>{if(['ArrowDown','PageDown'].includes(e.key)){if(document.activeElement===document.body){e.preventDefault();go(Math.min(N-1,Math.round(cur)+1))}}else if(['ArrowUp','PageUp'].includes(e.key)&&document.activeElement===document.body){e.preventDefault();go(Math.max(0,Math.round(cur)-1))}else if(e.key==='Home'&&document.activeElement===document.body){e.preventDefault();go(0)}else if(e.key==='End'&&document.activeElement===document.body){e.preventDefault();go(N-1)}});
// dust
const dust=$('#dust');for(let i=0;i<26;i++){const s=document.createElement('s');s.style.cssText=`left:${Math.random()*100}%;top:${60+Math.random()*50}%;animation-duration:${14+Math.random()*20}s;animation-delay:-${Math.random()*20}s;transform:scale(${.6+Math.random()*1.4})`;dust.appendChild(s)}
// camera
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
let cur=0,t0=performance.now();
const sm=x=>x*x*(3-2*x);
function frame(now){
 const target=maxS()>0?clamp(scrollY/maxS())*(N-1):0;
 cur=rm?target:cur+(target-cur)*.055;
 const i=Math.min(N-1,Math.floor(cur)),f=cur-i,pos=i+(i<N-1?sm(clamp((f-.28)/.72)):0),t=(now-t0)/1000;
 const yaw=rm?0:Math.sin(pos*1.7)*2.2+Math.sin(t*.5)*.5,pitch=rm?0:Math.sin(t*.4)*.35,bob=rm?0:Math.sin(t*1.1)*3;
 world.style.transform=`rotateX(${pitch}deg) rotateY(${yaw}deg) translate3d(0,${bob}px,${pos*SP}px)`;
 const cz=-pos*SP;
 rooms.forEach((r,k)=>{const d=Math.abs(-(k+.5)*SP+200-cz);r.style.setProperty('--fog',clamp(1-(d-.9*SP)/(1.4*SP)).toFixed(3));r.style.display=d>3.2*SP?'none':''});
 panels.forEach((p,k)=>{const o=clamp(1-Math.abs(pos-k)*2.4);p.style.opacity=o.toFixed(3);p.style.transform=`translateX(-50%) translateY(${(1-o)*24}px)`;p.classList.toggle('live',o>.5)});
 [...dots.children].forEach((b,k)=>b.classList.toggle('on',Math.round(pos)===k));
 rooms[1].flip.classList.toggle('on',Math.abs(pos-1)<.35);
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
